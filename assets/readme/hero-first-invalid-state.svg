<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 500"
     role="img"
     aria-labelledby="hero-title hero-desc">
  <title id="hero-title">review-cy 工程根因诊断</title>
  <desc id="hero-desc">停止 guard、retry 和 fallback 构成的补丁循环，沿证据链从可见症状回溯到首个错误状态。</desc>

  <rect width="1200" height="500" rx="24" fill="#0D1215"/>
  <rect x="1" y="1" width="1198" height="498" rx="23" fill="none" stroke="#29353B" stroke-width="2"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', 'PingFang SC', Arial, sans-serif">
    <text x="68" y="54" fill="#42B6A5" font-size="16" font-weight="700" letter-spacing="2.4">ENGINEERING ROOT-CAUSE DIAGNOSIS</text>
    <text x="68" y="139" fill="#F2EFE7" font-size="70" font-weight="760">review-cy</text>
    <text x="68" y="194" fill="#F2EFE7" font-size="31" font-weight="650">停止补丁循环，沿因果链找到真正根因</text>
    <text x="68" y="231" fill="#A9B4BA" font-size="19">Root cause before workaround · Evidence before edits</text>

    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="818" y="74" width="128" height="34" rx="17" fill="#162328" stroke="#42B6A5"/>
      <text x="882" y="96" fill="#7ED2C5">默认只读</text>
      <rect x="958" y="74" width="104" height="34" rx="17" fill="#1D2022" stroke="#536169"/>
      <text x="1010" y="96" fill="#C8D0D4">工具中立</text>
      <rect x="1074" y="74" width="78" height="34" rx="17" fill="#2B2418" stroke="#F2B84B"/>
      <text x="1113" y="96" fill="#F2C86E">可证伪</text>
    </g>

    <g>
      <rect x="68" y="300" width="205" height="117" rx="14" fill="#161C1F" stroke="#703C37" stroke-width="2"/>
      <text x="88" y="326" fill="#E98A80" font-size="16" font-weight="700" letter-spacing="1.4">补丁循环</text>
      <g font-size="15" font-weight="650" text-anchor="middle">
        <rect x="88" y="346" width="50" height="30" rx="7" fill="#2A1C1B"/>
        <text x="113" y="366" fill="#F0B1AA">guard</text>
        <text x="148" y="366" fill="#86534E">→</text>
        <rect x="160" y="346" width="46" height="30" rx="7" fill="#2A1C1B"/>
        <text x="183" y="366" fill="#F0B1AA">retry</text>
        <text x="216" y="366" fill="#86534E">→</text>
        <rect x="228" y="346" width="25" height="30" rx="7" fill="#2A1C1B"/>
        <text x="240" y="366" fill="#F0B1AA">…</text>
      </g>
      <path d="M242 388 C242 410 96 410 96 388" fill="none" stroke="#E35D4F" stroke-width="2.5" stroke-dasharray="6 6"/>
      <polygon points="95,388 102,399 88,399" fill="#E35D4F"/>
    </g>

    <g>
      <line x1="312" y1="286" x2="312" y2="432" stroke="#F2B84B" stroke-width="4"/>
      <rect x="286" y="276" width="52" height="26" rx="13" fill="#3A2C17"/>
      <text x="312" y="295" fill="#F2C86E" font-size="15" font-weight="800" text-anchor="middle">停止</text>
    </g>

    <g font-weight="720" text-anchor="middle">
      <rect x="354" y="326" width="142" height="64" rx="12" fill="#172126" stroke="#617078" stroke-width="2"/>
      <text x="425" y="366" fill="#C9D1D5" font-size="21">触发条件</text>

      <line x1="496" y1="358" x2="537" y2="358" stroke="#77878E" stroke-width="3"/>
      <polygon points="547,358 534,351 534,365" fill="#77878E"/>

      <rect x="548" y="326" width="178" height="64" rx="12" fill="#172126" stroke="#617078" stroke-width="2"/>
      <text x="637" y="366" fill="#C9D1D5" font-size="21">契约失守</text>

      <line x1="726" y1="358" x2="759" y2="358" stroke="#F2B84B" stroke-width="3"/>
      <polygon points="769,358 756,351 756,365" fill="#F2B84B"/>

      <rect x="770" y="315" width="218" height="86" rx="14" fill="#3A2C17" stroke="#F2B84B" stroke-width="3"/>
      <circle cx="966" cy="337" r="6" fill="#F2B84B"/>
      <text x="879" y="365" fill="#FFE0A0" font-size="23">首个错误状态</text>

      <line x1="988" y1="358" x2="1022" y2="358" stroke="#E35D4F" stroke-width="3"/>
      <polygon points="1032,358 1019,351 1019,365" fill="#E35D4F"/>

      <rect x="1033" y="326" width="119" height="64" rx="12" fill="#2A1C1B" stroke="#E35D4F" stroke-width="2"/>
      <text x="1092" y="366" fill="#F2B2AB" font-size="19">可见症状</text>
    </g>

    <g>
      <line x1="1093" y1="443" x2="842" y2="443" stroke="#42B6A5" stroke-width="3"/>
      <polygon points="830,443 846,434 846,452" fill="#42B6A5"/>
      <text x="962" y="470" fill="#7ED2C5" font-size="18" font-weight="700" text-anchor="middle">沿证据回溯</text>
      <line x1="879" y1="401" x2="879" y2="437" stroke="#42B6A5" stroke-width="2" stroke-dasharray="5 5"/>
    </g>
  </g>
</svg>
